name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Build projects (Release, warnings as errors)
        shell: pwsh
        run: |
          $projects = @(
            'src/Sona.App/Sona.App.csproj',
            'src/Sona.Agent/Sona.Agent.csproj',
            'tests/Sona.Tests/Sona.Tests.csproj',
            'tests/Sona.WindowsTests/Sona.WindowsTests.csproj'
          )
          foreach ($project in $projects) {
            Write-Host "Building $project"
            dotnet build $project -c Release --disable-build-servers -p:UseSharedCompilation=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run core tests (Sona.Tests)
        shell: pwsh
        run: |
          dotnet run --project tests/Sona.Tests/Sona.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows deterministic checks
        shell: pwsh
        run: |
          $exe = '.\tests\Sona.WindowsTests\bin\Release\net8.0-windows\Sona.WindowsTests.exe'
          $proof = Join-Path $env:RUNNER_TEMP 'sona-ci-proof'
          New-Item -ItemType Directory -Path $proof -Force | Out-Null
          $checks = @(
            @('--owned-clipboard-checks'),
            @('--completed-paste-fixture'),
            @('--capture-policy-checks'),
            @('--sound-feedback-checks'),
            @('--history-range-checks'),
            @('--discord-closed-checks'),
            @('--discord-disconnect-checks'),
            @('--active-app-state-fixture'),
            @('--theme-material-fixture'),
            @('--theme-startup-fixture'),
            @('--presentation-fixture'),
            @('--history-controls-fixture', (Join-Path $proof 'history-controls')),
            @('--history-controls-no-retention-fixture', (Join-Path $proof 'history-controls-noret'))
          )
          foreach ($argsList in $checks) {
            Write-Host "Running $($argsList -join ' ')"
            & $exe @argsList
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Validate release version and changelog metadata
        shell: pwsh
        run: |
          $versionMatch = Select-String -LiteralPath 'Directory.Build.props' -Pattern '<Version>([0-9]+\.[0-9]+\.[0-9]+)</Version>'
          if (-not $versionMatch) { throw 'Missing Version in Directory.Build.props' }
          $tag = 'v' + $versionMatch.Matches[0].Groups[1].Value
          pwsh -NoProfile -File tools/release-notes.ps1 -Tag $tag | Out-Null
          Write-Host "Verified release notes metadata for $tag"

      - name: Audit NuGet dependencies for vulnerabilities
        shell: pwsh
        run: |
          $appProjects = @(
            'src/Sona.App/Sona.App.csproj',
            'src/Sona.Agent/Sona.Agent.csproj'
          )
          foreach ($project in $appProjects) {
            $output = dotnet list $project package --vulnerable --include-transitive 2>&1
            $output | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($output | Where-Object { $_ -match '^\s*>' }) {
              throw "Vulnerable NuGet package detected in $project"
            }
          }
