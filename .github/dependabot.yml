version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/src/Sona.Core"
      - "/src/Sona.App"
      - "/src/Sona.Agent"
      - "/tests/Sona.Tests"
      - "/tests/Sona.WindowsTests"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
